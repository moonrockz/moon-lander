# Mise configuration for the moonrockz/moon-lander monorepo.
#
# Tools are pinned here. Tasks are MoonBit scripts in scripts/*.mbtx, run with moonx, so one script
# works on every platform (see AGENTS.md).
#
# Local overrides go in .config/mise/config.local.toml (gitignored); see config.local.toml.example.

[tools]
# Node.js runs the js target in `moon test --target js` and `moon run --target js`.
node = "24.14.1"

# Bun builds and bundles the TypeScript host adapter for the js target (pkgs/lander/adapters/node/)
bun = "1.4.3"

# Browser harness CLI; must match tests/browser/package.json exactly.
"npm:@playwright/test" = "1.64.1"

# YAML linting, pinned so lint results do not change between machines
yamllint = "1.38.0"

# Git hooks manager; the hooks are in lefthook.yml
lefthook = "2.1.1"

# Spec-driven change proposals under openspec/; needs Node.js 20.19 or later
"npm:@fission-ai/openspec" = "1.14.1"

# C compiler used through the external moonrockz/zig-cross tool
zig = "0.17.0"

# MoonBit toolchain, pinned. mise cannot resolve "latest" for an http: tool, and a pinned version
# keeps CI and every machine on the same compiler. To move to a newer release, change the version
# here and in each URL (with "+" written as "%2B"), taken from
# https://cli.moonbitlang.com/binaries/<version>/.
#
# The binary archive omits the core library. CI (and a fresh machine) completes it with
# `curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOON_HOME=$(mise where http:moonbit) bash -s -- <version>`.

[tools."http:moonbit"]
version = "0.10.15+943464bfa"
bin_path = "bin"

[tools."http:moonbit".platforms]
linux-x64 = { url = "https://cli.moonbitlang.com/binaries/0.10.15%2B943464bfa/moonbit-linux-x86_64.tar.gz" }
macos-arm64 = { url = "https://cli.moonbitlang.com/binaries/0.10.15%2B943464bfa/moonbit-darwin-aarch64.tar.gz" }
windows-x64 = { url = "https://cli.moonbitlang.com/binaries/0.10.15%2B943464bfa/moonbit-windows-x86_64.zip", format = "zip" }

[env]
_.path = ["./node_modules/.bin"]

# Every task is a MoonBit script: `moonx scripts/<name>.mbtx`. Pass arguments after `--`.

[tasks.build]
description = "Build all workspace members (args: targets, --release; default: wasm wasm-gc js native)"
run = "moonx scripts/build.mbtx"

[tasks."build:wasm"]
description = "Build all workspace members for the wasm target"
run = "moonx scripts/build.mbtx wasm"

[tasks."build:wasm-gc"]
description = "Build all workspace members for the wasm-gc target"
run = "moonx scripts/build.mbtx wasm-gc"

[tasks."build:js"]
description = "Build all workspace members for the js target"
run = "moonx scripts/build.mbtx js"

[tasks."build:native"]
description = "Build all workspace members for native in release mode"
run = "moonx scripts/build.mbtx native --release"

[tasks."build:site"]
description = "Build the docs site into _site/ (args: --main)"
run = "moonx scripts/site.mbtx build"

[tasks."check:site"]
description = "Check the built docs site in _site/"
run = "moonx scripts/site.mbtx check"

[tasks."test:site"]
description = "Test the docs site packages and the highlight step"
run = "moonx scripts/site.mbtx test"

[tasks."dev:site"]
description = "Build the docs site, serve it at http://127.0.0.1:4173/moon-lander/ and build again on change (args: --port <n>, --no-watch)"
depends = ["build:site"]
run = "moonx scripts/serve-site.mbtx"

[tasks.test]
description = "Run tests for all workspace members (args: targets; default: wasm wasm-gc js native)"
run = "moonx scripts/test.mbtx"

[tasks.format]
description = "Format MoonBit code"
run = "moonx scripts/format.mbtx"

[tasks.lint]
description = "Run all lint tasks (YAML, MoonBit format and check)"
run = "moonx scripts/lint.mbtx"

[tasks."lint:moonbit"]
description = "Check MoonBit formatting and run moon check"
run = "moonx scripts/lint-moonbit.mbtx"

[tasks."lint:yaml"]
description = "Lint YAML files with yamllint"
run = "moonx scripts/lint-yaml.mbtx"

[tasks.validate]
description = "Run all validation checks"
depends = ["validate:packages", "validate:versions"]

[tasks."validate:packages"]
description = "Verify the workspace package structure against moon.work"
run = "moonx scripts/validate-packages.mbtx"

[tasks."validate:versions"]
description = "Verify that every module and version string has the version of the root moon.mod"
run = "moonx scripts/versions.mbtx check"

[tasks."test:native-zig"]
description = "Run native tests with zig as the C compiler"
run = "moonx moonrockz/zig-cross@0.1.2 exec host -- moonx scripts/test.mbtx native"

[tasks."test:node-adapter"]
description = "Test the js host adapter on Node and Bun (args: node|bun)"
run = "moonx scripts/test-node-adapter.mbtx"

[tasks."test:scripts"]
description = "Test the task scripts"
run = "moonx scripts/test-scripts.mbtx"

[tasks."build:browser-fixture"]
description = "Generate the spike FFI and build the browser fixture"
run = "moonx scripts/build-browser-fixture.mbtx"

[tasks."build:browser-adapter"]
description = "Generate the production browser Web API adapter"
run = "moonx scripts/build-browser-adapter.mbtx"

[tasks."check:browser-adapter"]
description = "Check production browser adapter freshness without rewriting"
run = "moonx scripts/build-browser-adapter.mbtx --check"

[tasks."check:browser-fixture"]
description = "Check that the generated browser spike adapter is current"
run = "moonx scripts/build-browser-fixture.mbtx --check"

[tasks."browsers:install"]
description = "Install the locked browser harness and three engines (args: --with-deps on Linux)"
run = "moonx scripts/browser.mbtx install"

[tasks."test:browser"]
description = "Build once and test the fixture in Chromium, Firefox and WebKit"
run = "moonx scripts/browser.mbtx test"

[tasks."test:browser-failures"]
description = "Prove browser assertion and missing-engine failures propagate"
run = "moonx scripts/browser.mbtx test --verify-failures"

[tasks."build:node-adapter"]
description = "Bundle the TypeScript js host adapter with Bun"
run = "moonx scripts/build-node-adapter.mbtx"

[tasks."check:node-adapter"]
description = "Check that the generated js host adapter is current"
run = "moonx scripts/build-node-adapter.mbtx --check"

[tasks."check:config"]
description = "Compare configuration values, provenance and reports on all four targets"
run = "moonx scripts/check-config.mbtx"

[tasks."check:formats"]
description = "Verify linked formats, parser trimming and leak rejection on all four targets"
run = "moonx scripts/check-formats.mbtx --verify-failures"

[tasks."check:formats-registry"]
description = "Verify the packaged candidate through an isolated loopback registry consumer"
run = "moonx scripts/check-formats-registry.mbtx"

[tasks."check:formats-published"]
description = "Release gate: verify the public registry candidate outside the workspace"
run = "moonx scripts/check-formats-registry.mbtx --published"

[tasks.check]
description = "Run lint, validate, tests, task script tests and builds"
run = "moonx scripts/check.mbtx"

[tasks."check:openrpc-assets"]
description = "Verify frozen OpenRPC source digests and deliberate failure status"
run = "moonx scripts/check-openrpc-assets.mbtx --verify-failures"

[tasks."check:openrpc"]
description = "Verify OpenRPC focused tests and an isolated source consumer on all four targets"
run = "moonx scripts/check-openrpc.mbtx"

[tasks."qualify:openrpc"]
description = "Qualify OpenRPC against the frozen corpus with independent Ajv and four targets"
run = "moonx scripts/qualify-openrpc.mbtx"

[tasks."qualify:openrpc-failures"]
description = "Prove that wrong expectations, broken references, altered assets and missing files fail qualification"
run = "moonx scripts/qualify-openrpc.mbtx --verify-failures"

[tasks."build:openrpc-artifacts"]
description = "Generate the pinned OpenRPC artifact metaschemas from frozen assets"
run = "moonx scripts/generate-openrpc-artifacts.mbtx"

[tasks."check:openrpc-artifacts"]
description = "Reject stale OpenRPC artifact metaschemas and license without rewriting"
run = "moonx scripts/generate-openrpc-artifacts.mbtx --check"

[tasks."build:openrpc-unicode"]
description = "Generate portable OpenRPC regex identifier tables from frozen Unicode data"
run = "moonx scripts/generate-openrpc-unicode.mbtx"

[tasks."check:openrpc-unicode"]
description = "Reject stale OpenRPC Unicode tables and license without rewriting"
run = "moonx scripts/generate-openrpc-unicode.mbtx --check"

[tasks.clean]
description = "Remove build artifacts"
run = "moonx scripts/clean.mbtx"

[tasks."hooks:install"]
description = "Install git hooks with lefthook"
run = "moonx scripts/hooks-install.mbtx"

[tasks.list-tasks]
description = "List mise tasks"
run = "mise tasks"

[settings]
experimental = true
