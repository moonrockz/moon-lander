# Git hooks for moonrockz/moon-lander. Install them with `mise run hooks:install`.
# Every check is a mise task, so the hooks run the same commands as CI.

pre-commit:
  commands:
    lint-check:
      run: mise run lint:moonbit

pre-push:
  commands:
    lint:
      run: mise run lint
    validate:
      run: mise run validate
    test:
      run: mise run test
