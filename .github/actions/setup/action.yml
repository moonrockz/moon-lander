name: Setup toolchain
description: Install mise, the tools pinned in .config/mise/config.toml, and the complete MoonBit toolchain.

inputs:
  github-token:
    description: Token for mise to query GitHub releases without rate limits.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install mise and pinned tools
      if: runner.os != 'Windows'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        MISE_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        curl -fsSL https://mise.run | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
        export PATH="$HOME/.local/bin:$PATH"
        mise --version
        mise trust
        mise install

    # mise.run has no Windows installer, so Windows uses the mise action.
    - name: Install mise and pinned tools (Windows)
      if: runner.os == 'Windows'
      uses: jdx/mise-action@v5
      with:
        github_token: ${{ inputs.github-token }}
        cache: false

    - name: Complete the MoonBit toolchain
      if: runner.os != 'Windows'
      shell: bash
      # The binary archive that mise installs omits the core library and moonx. The official
      # installer adds them into the same directory, for the same pinned version.
      run: |
        set -euo pipefail
        export PATH="$HOME/.local/bin:$PATH"
        moonbit_dir="$(mise where http:moonbit)"
        moonbit_version="$(mise current http:moonbit)"
        curl -fsSL https://cli.moonbitlang.com/install/unix.sh | \
          MOON_HOME="$moonbit_dir" bash -s -- "$moonbit_version"
        chmod +x "$moonbit_dir"/bin/* || true
        echo "$moonbit_dir/bin" >> "$GITHUB_PATH"
        echo "MOON_HOME=$moonbit_dir" >> "$GITHUB_ENV"

    - name: Complete the MoonBit toolchain (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      # The Windows installer adds the core library and moonx, as unix.sh does above.
      run: |
        $ErrorActionPreference = 'Stop'
        $moonbitDir = mise where http:moonbit
        $env:MOON_HOME = $moonbitDir
        $env:MOONBIT_INSTALL_VERSION = mise current http:moonbit
        Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
        "$moonbitDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        "MOON_HOME=$moonbitDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Report versions and update the registry
      shell: bash
      run: |
        set -euo pipefail
        moon version --all
        moon update
