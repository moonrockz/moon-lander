name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_EXPERIMENTAL: 'true'

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install pinned tools
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint
        run: mise run lint
      - name: Check the generated Node adapter
        run: mise run check:node-adapter
      - name: Check the generated browser fixture
        run: mise run check:browser-fixture
      - name: Check the production browser adapter
        run: mise run check:browser-adapter
      - name: Validate workspace
        run: mise run validate
      - name: Verify frozen Moonx runtime provenance
        run: mise run check:moonx-runtime
      - name: Verify frozen Moonx drift rejection
        run: mise run check:moonx-drift

  # One job for each target tests it and then builds it in release mode. A separate build job
  # spent more time on setup than on its build (wasm, wasm-gc and js build in 6 to 12 s).
  test:
    name: Test and build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install pinned tools
        id: setup
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test
        run: mise run test -- ${{ matrix.target }}
      - name: Check that the mediator tests run on this target
        run: mise run check:mediator -- ${{ matrix.target }}
      - name: Check that the actor tests run on this target
        run: mise run check:actors -- ${{ matrix.target }}
      - name: Check that the logging tests run on this target
        run: mise run check:logging -- ${{ matrix.target }}
      - name: Test the js host adapter on Bun
        if: matrix.target == 'js'
        run: mise run test:node-adapter -- bun
      # The release build also runs when a test fails, so one run shows both results.
      - name: Build in release mode
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: mise run build -- ${{ matrix.target }} --release

  test-native-zig:
    name: Test native (zig)
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install pinned tools
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test using the external zig-cross tool
        run: mise run test:native-zig

  # Cross-build from Linux with zig-cross, for the targets that no CI machine builds: linux-arm64
  # with the full runtime (the hosting program and the async-free programs), and darwin-x64 with
  # the experimental sync runtime (the async-free programs). The macOS job builds darwin-arm64 and
  # the Windows job builds windows-x64 natively, so this job does not cross-build them. The task
  # runs zig-cross doctor first and stops on a blocker. This is a compile, link and header check;
  # it does not run the programs. See "Cross-builds with zig-cross" in README.md.
  cross-build:
    name: Cross-build (zig)
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install pinned tools
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run doctor and cross-build linux-arm64 and darwin-x64
        run: mise run build:cross -- linux-arm64 darwin-x64
      - name: Keep the doctor reports of a failed cross-build
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: zig-cross-doctor
          path: _build/cross/doctor-*.json
          if-no-files-found: ignore

  test-scripts:
    name: Test task scripts
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install pinned tools
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compare configuration values, provenance and reports
        run: mise run check:config
      - name: Verify format trimming and failure propagation
        run: mise run check:formats
      - name: Verify the packaged candidate through a registry consumer
        run: mise run check:formats-registry
      - name: Verify frozen OpenRPC specification assets
        run: mise run check:openrpc-assets
      - name: Verify the isolated OpenRPC source consumer
        run: mise run check:openrpc
      - name: Test the console drivers with native and js children, and a consumer outside the workspace
        run: mise run check:console
      - name: Qualify the Moonx launcher on stock 0.10.17
        run: mise run check:moonx
      - name: Qualify the Moonx launcher on stock 0.10.16
        run: mise run check:moonx-stock16
      - name: Run retained Moonx runtime tests sequentially
        run: mise run check:moonx-retained
      - name: Test the logging sinks with native, Node.js and Bun children, and isolated consumers
        run: mise run check:logging-sinks
      - name: Run the embedded driver with help and version, and check for exit imports
        run: mise run check:embedded
      - name: Verify generated OpenRPC Unicode data
        run: mise run check:openrpc-unicode
      - name: Verify generated OpenRPC artifact metaschemas
        run: mise run check:openrpc-artifacts
      - name: Qualify OpenRPC against the frozen corpus
        run: mise run qualify:openrpc
      - name: Verify the packaged OpenRPC candidate through a registry consumer
        run: mise run check:openrpc-registry
      - name: Verify every release library through registry consumers
        run: mise run check:framework-registry -- --cold-cache
      - name: Test task scripts
        run: mise run test:scripts
      - name: Retain source-bound Moonx qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: moonx-linux
          path: _build/moonx/*.json
          if-no-files-found: ignore
          overwrite: true

  # Real browser execution cannot be proved by Node tests. Build one fixture for
  # all three engines in one Linux job, required on the same events as other CI.
  browser:
    name: Browser configuration (Chromium and Firefox)
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    # The pinned Playwright image holds the three pinned engines and their OS packages, so this job
    # installs nothing with apt. Its tag must match the Playwright pin in .config/mise/config.toml.
    container:
      # A tag with a digest cannot be split.
      # yamllint disable-line rule:line-length
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --user 1001
    env:
      # The image has no pipx, and this job does not lint YAML.
      MISE_DISABLE_TOOLS: yamllint
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install pinned tools
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install locked harness and check the engines
        run: mise run browsers:install
      - name: Test browsers and failure propagation
        # The image has no C compiler, so zig builds the native parity reference.
        # WebKit runs in browser-nightly.yml and in release validation, not here: its page loads
        # stall about once in 350 loads on GitHub Linux runners (lander-4us.22).
        run: mise run test:browser-zig -- --verify-failures --engines chromium,firefox

  # Windows support is a project requirement, so PRs build and test native and js there. One job
  # runs both targets: the Windows setup takes 60 to 90 s, longer than the js work. The native
  # steps run also when a js step fails. zig-cross cannot replace this job: moonbitlang/async needs
  # MSVC, and a cross-built Windows program can read OsString values wrongly (moon#2320).
  windows:
    name: Windows (js and native)
    runs-on: windows-latest
    needs: [lint]
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install pinned tools
        id: setup
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build js
        id: js-build
        run: mise run build -- js
      - name: Test js
        if: ${{ !cancelled() && steps.js-build.outcome == 'success' }}
        run: mise run test -- js
      - name: Test the js host adapter on Bun
        if: ${{ !cancelled() && steps.js-build.outcome == 'success' }}
        run: mise run test:node-adapter -- bun
      - name: Set up the MSVC compiler for native builds
        id: msvc
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build native
        id: native-build
        if: ${{ !cancelled() && steps.msvc.outcome == 'success' }}
        run: mise run build -- native
      - name: Test native
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: mise run test -- native
      - name: Test the toolchain wrapper
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: mise exec -- moonx scripts/toolchain.mbtx scripts/test-scripts.mbtx toolchain.mbtx
      - name: Compare configuration values, provenance and reports
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: mise run check:config
      - name: Verify format trimming and failure propagation
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: mise run check:formats
      # Real CTRL_BREAK_EVENT delivery to native, Node.js and Bun children. The isolated consumer
      # copy runs on Linux and macOS only.
      - name: Test the console drivers with native and js children
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: mise run check:console -- --no-consumer
      - name: Qualify Moonx finite and isolated console behavior on stock 0.10.17
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: mise run check:moonx
      - name: Qualify Moonx finite and isolated console behavior on stock 0.10.16
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: mise run check:moonx-stock16
      # Real console, file, drain and CTRL_BREAK_EVENT behavior of the logging sinks in native,
      # Node.js and Bun children, and the isolated consumers.
      - name: Test the logging sinks with native, Node.js and Bun children
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
        run: mise run check:logging-sinks
      - name: Retain actual Windows Moonx qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: moonx-windows
          path: _build/moonx/*.json
          if-no-files-found: ignore
          overwrite: true

  # The core observation must also agree on every target on macOS.
  # Reuse the existing macOS setup and retain its Node/Bun adapter coverage. zig-cross cannot
  # replace this job: it runs signals, configuration paths and the outside consumer on macOS, and
  # moonbitlang/async needs the macOS SDK to compile.
  node-adapter-macos:
    name: Node adapter (macOS)
    runs-on: macos-latest
    needs: [lint]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install pinned tools
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test the js host adapter on Node and Bun
        run: mise run test:node-adapter
      - name: Compare configuration values, provenance and reports
        run: mise run check:config
      - name: Verify format trimming and failure propagation
        run: mise run check:formats
      - name: Test the console drivers with native and js children, and a consumer outside the workspace
        run: mise run check:console
      - name: Test the logging sinks with native, Node.js and Bun children, and isolated consumers
        run: mise run check:logging-sinks
      - name: Qualify the Moonx launcher on stock 0.10.17
        run: mise run check:moonx
      - name: Qualify the Moonx launcher on stock 0.10.16
        run: mise run check:moonx-stock16
      - name: Retain source-bound Moonx qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: moonx-macos
          path: _build/moonx/*.json
          if-no-files-found: ignore
          overwrite: true

  # The docs site. It runs on each pull request with no path filter, because a path-filtered
  # required check stays pending on other pull requests. It builds the site and does not deploy it.
  site:
    name: Site
    needs: [lint]
    uses: ./.github/workflows/site-build.yml
    with:
      pages: false

  # A single required check for branch protection.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [lint, test, test-native-zig, cross-build, test-scripts, browser, windows, node-adapter-macos, site]
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[]
            | select(.value.result != "success")
            | "\(.key): \(.value.result)"' <<<"$NEEDS")"
          if [ -n "$failed" ]; then
            echo "::error::Required CI jobs did not succeed"
            echo "$failed"
            exit 1
          fi
