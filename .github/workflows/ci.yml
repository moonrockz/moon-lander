name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_EXPERIMENTAL: 'true'

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install pinned tools
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint
        run: mise run lint
      - name: Check the generated Node adapter
        run: mise run check:node-adapter
      - name: Validate workspace
        run: mise run validate

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install pinned tools
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: mise run build -- ${{ matrix.target }} --release

  test:
    name: Test (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install pinned tools
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test
        run: mise run test -- ${{ matrix.target }}
      - name: Test the js host adapter on Bun
        if: matrix.target == 'js'
        run: mise run test:node-adapter -- bun

  test-native-zig:
    name: Test native (zig)
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install pinned tools
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test using the external zig-cross tool
        run: mise run test:native-zig

  test-scripts:
    name: Test task scripts
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install pinned tools
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test task scripts
        run: mise run test:scripts

  # Windows support is a project requirement, so PRs build and test native and js there.
  windows:
    name: Windows (${{ matrix.target }})
    runs-on: windows-latest
    needs: [lint]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [js, native]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install pinned tools
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up the MSVC compiler for native builds
        if: matrix.target == 'native'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        run: mise run build -- ${{ matrix.target }}
      - name: Test
        run: mise run test -- ${{ matrix.target }}
      - name: Test the js host adapter on Bun
        if: matrix.target == 'js'
        run: mise run test:node-adapter -- bun

  # The js FFI bundle must work on Node and Bun on macOS as well as Linux/Windows.
  # Keep this focused on the adapter; the existing jobs own workspace coverage.
  node-adapter-macos:
    name: Node adapter (macOS)
    runs-on: macos-latest
    needs: [lint]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install pinned tools
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test the js host adapter on Node and Bun
        run: mise run test:node-adapter

  # The docs site. It runs on each pull request with no path filter, because a path-filtered
  # required check stays pending on other pull requests. It builds the site and does not deploy it.
  site:
    name: Site
    needs: [lint]
    uses: ./.github/workflows/site-build.yml
    with:
      pages: false

  # A single required check for branch protection.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [lint, build, test, test-native-zig, test-scripts, windows, node-adapter-macos, site]
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[]
            | select(.value.result != "success")
            | "\(.key): \(.value.result)"' <<<"$NEEDS")"
          if [ -n "$failed" ]; then
            echo "::error::Required CI jobs did not succeed"
            echo "$failed"
            exit 1
          fi
