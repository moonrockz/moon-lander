<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moon-Lander brand assets</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; font: 15px/1.5 system-ui, sans-serif; background: var(--background, #f8f9fc); color: var(--foreground, #182238); }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 24px; }
    p { margin: 4px 0 0; color: var(--muted-foreground, #637087); }
    button { padding: 8px 14px; border: 1px solid var(--border, #d5dbe5); border-radius: 8px; color: var(--foreground, #182238); background: var(--card, white); cursor: pointer; font: inherit; }
    button:hover { background: var(--accent, #e8edf5); color: var(--accent-foreground, #182238); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
    article { border: 1px solid var(--border, #d5dbe5); border-radius: 12px; overflow: hidden; }
    .art { background: #edf0f6; padding: 20px; display: flex; justify-content: center; align-items: center; aspect-ratio: 1; }
    .dark .art { background: #101831; }
    .art img { width: 100%; max-width: 280px; height: auto; }
    .caption { padding: 14px; background: var(--card, white); }
    h2 { font-size: 16px; margin: 0; }
    .sizes { display: flex; align-items: end; flex-wrap: wrap; gap: 24px; padding: 18px; }
    figure { margin: 0; text-align: center; }
    figcaption { margin-top: 6px; font-size: 12px; color: var(--muted-foreground, #637087); }
    .size-panel { margin-top: 18px; border: 1px solid var(--border, #d5dbe5); border-radius: 12px; padding: 14px; }
    .size-panel .art { aspect-ratio: auto; justify-content: start; }
    .sizes img { display: block; width: auto; max-width: none; margin-inline: auto; }
  </style>
</head>
<body>
  <header>
    <div><h1>Moon-Lander</h1><p>The Moonrockz bunny lands in gold.</p></div>
    <button type="button" aria-pressed="false" onclick="const dark=document.body.classList.toggle('dark'); this.setAttribute('aria-pressed', String(dark)); this.textContent=dark?'Use light background':'Use dark background'">Use dark background</button>
  </header>
  <main>
    <div class="grid">
      <article><div class="art"><img src="moon-lander-badge.png" alt="Moon-Lander primary badge with bunny, gold lander and wordmark"></div><div class="caption"><h2>Primary badge</h2><p>README, project pages and cover art.</p></div></article>
      <article><div class="art"><img src="moon-lander-mark.png" alt="Pink bunny piloting a gold lunar lander without background or lettering"></div><div class="caption"><h2>Standalone mark</h2><p>Stickers, slides and illustrations.</p></div></article>
      <article><div class="art"><img src="moon-lander-icon.png" alt="Simplified bunny portrait in a gold cockpit inside a navy circle"></div><div class="caption"><h2>App icon</h2><p>Favicons and navigation.</p></div></article>
    </div>
    <section class="size-panel"><h2>Icons at actual size</h2><div class="art sizes">
      <figure><img src="icons/favicon-16.png" width="16" height="16" alt="16 pixel favicon"><figcaption>16 px</figcaption></figure>
      <figure><img src="icons/favicon-32.png" width="32" height="32" alt="32 pixel favicon"><figcaption>32 px</figcaption></figure>
      <figure><img src="icons/favicon-48.png" width="48" height="48" alt="48 pixel favicon"><figcaption>48 px</figcaption></figure>
      <figure><img src="icons/logo-64.png" width="64" height="64" alt="64 pixel header icon"><figcaption>64 px</figcaption></figure>
    </div></section>
  </main>
</body>
</html>
